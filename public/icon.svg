<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <!-- Outline ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.8"/>
  <!-- Twin ponytails cute mascot silhouette -->
  <!-- Left ponytail -->
  <path d="M140 180 C110 130, 80 170, 70 240 C60 300, 100 320, 130 270 C140 250, 150 210, 160 200 Z" fill="#ec4899" opacity="0.85" filter="url(#glow)"/>
  <!-- Right ponytail -->
  <path d="M372 180 C402 130, 432 170, 442 240 C452 300, 412 320, 382 270 C372 250, 362 210, 352 200 Z" fill="#8b5cf6" opacity="0.85" filter="url(#glow)"/>
  <!-- Head base -->
  <circle cx="256" cy="240" r="110" fill="#1e293b" stroke="url(#neonGrad)" stroke-width="8"/>
  <!-- Hair bangs -->
  <path d="M160 210 Q256 160 352 210 Q320 250 256 220 Q192 250 160 210 Z" fill="#334155"/>
  <!-- Cute anime eyes -->
  <!-- Left eye wink -->
  <path d="M200 245 Q215 235 230 245" fill="none" stroke="#ec4899" stroke-width="7" stroke-linecap="round"/>
  <!-- Right eye big spark -->
  <ellipse cx="282" cy="245" rx="16" ry="22" fill="#06b6d4"/>
  <circle cx="287" cy="238" r="6" fill="#ffffff"/>
  <circle cx="277" cy="252" r="3" fill="#ffffff"/>
  <!-- Blush -->
  <ellipse cx="195" cy="268" rx="12" ry="6" fill="#f43f5e" opacity="0.6"/>
  <ellipse cx="317" cy="268" rx="12" ry="6" fill="#f43f5e" opacity="0.6"/>
  <!-- Cute smile -->
  <path d="M245 268 Q256 280 267 268" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Cute checkmark star decoration in corner -->
  <path d="M210 390 L240 420 L310 350" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="256" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">TODO-CHAN</text>
</svg>
